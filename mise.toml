# Local CI toolchain (#163, skill local-ci): every CLI the justfile tiers and the lefthook hooks call,
# pinned; `mise.lock` pins the checksums. `just setup` installs it. Run the tiers as
# `mise x -- just <tier>` when the shell does not activate mise (the git hooks do). Outside mise:
# docker (act, `just rehearse`), ssh-keygen (attestation), sonar-scanner-npm (devDependency,
# `pnpm exec`) and Semgrep (`uvx semgrep@…` in the justfile: a mise pipx install needs a
# mise-managed Python).
#
# Node matches .nvmrc and the `engines` floor (>= 22): a global mise shim resolving another Node would
# run the suites on a version nothing else tests.
[tools]
node = "22.21.1"
pnpm = "10.30.3"
just = "1.59.0"
lefthook = "2.2.2"
typos = "1.52.0"
actionlint = "1.7.12"
zizmor = "1.32.0"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
trufflehog = "3.99.8"
osv-scanner = "2.7.0"  # pnpm-lock.yaml
uv = "0.13.7"          # Semgrep Community Edition via `uvx semgrep@…`
act = "0.2.92"         # `just rehearse` of a changed workflow; pinned: its log format is parsed

[settings]
lockfile = true
