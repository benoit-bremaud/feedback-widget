# Git hooks for the local CI (#163, skill local-ci): tier L0 on commit, L1 on push. Install once per
# clone: `just setup` (mise install + lefthook install). `mise x --` puts the pinned tools of
# mise.toml (Node 22 and pnpm included) on PATH whether or not the shell activates mise.
pre-commit:
  parallel: true
  jobs:
    - name: staged secrets
      run: mise x -- gitleaks git --staged --redact --no-banner .
    - name: eslint
      glob: '*.{js,ts}'
      run: mise x -- pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files} # ignored files (*.config.ts) are not warnings
    - name: prettier
      glob: '*.{js,ts,json,md,yml,yaml}'
      run: mise x -- pnpm exec prettier --check {staged_files}
    - name: typos
      run: mise x -- typos --force-exclude {staged_files}
    - name: actionlint
      glob: '.github/workflows/*.{yml,yaml}'
      run: mise x -- actionlint {staged_files}
    - name: shellcheck
      glob: '*.sh'
      run: mise x -- shellcheck --severity=warning {staged_files}

commit-msg:
  jobs:
    - name: conventional commit subject
      run: sh scripts/check-commit-msg.sh {1}

pre-push:
  jobs:
    - name: just check (L1)
      run: mise x -- just check
