name: Bug Report
description: Report something that is not working as expected
title: "fix(<area>): <short description>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please search for [existing issues](https://github.com/benoit-bremaud/feedback-widget/issues) to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1.\n2.\n3."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The area of the codebase affected. Pick the narrowest match.
      options:
        - "area:core"
        - "area:web"
        - "area:ci"
        - "area:react-native"
        - "area:governance"
        - "area:testing"
        - "area:docs"
        - "area:release"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 blocks everything; use sparingly.
      options:
        - "prio:P0 — Foundation, blocks everything"
        - "prio:P1 — High"
        - "prio:P2 — Medium"
        - "prio:P3 — Low / nice to have"
      default: 2
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. @benoit-bremaud/feedback-widget@0.1.1-rc2 · commit abc1234"

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, network traces, or any other context that helps reproduce.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched for existing issues and this is not a duplicate.
          required: true
        - label: After submitting I will set the sidebar metadata — assignee, label triptych (`type:*` + `area:*` + `prio:*`), project `feedback-widget`, and the matching milestone.
          required: true
