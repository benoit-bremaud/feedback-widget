name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    # Dependency review requires GitHub Advanced Security on private
    # repositories. This project is private and does not have GHAS,
    # so the job is gated on visibility: it runs on public repos and
    # auto-activates if the repo is ever made public.
    if: github.event.repository.visibility == 'public'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        with:
          fail-on-severity: high
