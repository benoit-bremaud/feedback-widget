name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload LCOV coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: packages/*/coverage/lcov.info
          if-no-files-found: error

      # No SonarQube step here on purpose. SonarCloud's free plan analyzes
      # public projects only, and this repo is private-first — so the scan
      # could never authenticate and failed every PR regardless of the diff.
      # Static analysis runs against the self-hosted instance before pushing
      # instead; see CONTRIBUTING.md § Static analysis. Restore a hosted scan
      # here when the repo goes public (see the public release checklist).
