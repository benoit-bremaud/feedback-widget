name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history needed for the main-ancestor check below.
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} points to commit ${GITHUB_SHA}, which is not an ancestor of origin/main. Refusing to publish — tags must come from main."
            exit 1
          fi
          echo "Tag ${GITHUB_REF#refs/tags/} (${GITHUB_SHA}) is on main; proceeding with publish."

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@benoit-bremaud'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build must run BEFORE typecheck so packages/web can resolve
      # the @benoit-bremaud/feedback-widget-core types from its dist/.
      # Same ordering as ci.yml (fixed in PR #2).
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Determine npm dist-tag
        id: disttag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Stable releases (vX.Y.Z) go to the `latest` dist-tag.
          # Prereleases (vX.Y.Z-rc1, -beta.2, -alpha, etc.) go to `rc`,
          # so `pnpm add @benoit-bremaud/feedback-widget` never installs
          # a prerelease by default — consumers must opt in with
          # `pnpm add @benoit-bremaud/feedback-widget@rc`.
          if [[ "$TAG" == *-* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved dist-tag for $TAG: $(grep ^tag "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Publish packages
        run: pnpm -r publish --no-git-checks --access restricted --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
