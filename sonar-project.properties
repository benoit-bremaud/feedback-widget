sonar.projectKey=benoit-bremaud_feedback-widget
sonar.organization=benoit-bremaud
sonar.host.url=https://sonarcloud.io

sonar.sources=packages/core/src,packages/web/src
sonar.tests=packages/core/src,packages/web/src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/web/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/dist/**,packages/web/src/index.ts
sonar.typescript.tsconfigPath=packages/core/tsconfig.json,packages/web/tsconfig.json

sonar.sourceEncoding=UTF-8
